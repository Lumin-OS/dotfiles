# The lock screen, which hypridle and Super+L start.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrains Mono

general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/luminos/default.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgb(1f1d2e)
    outer_color = rgb(9ccfd8)
    check_color = rgb(31748f)
    fail_color = rgb(eb6f92)
    font_color = rgb(e0def4)
    font_family = $font
    fade_on_empty = false
    rounding = 12
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}
